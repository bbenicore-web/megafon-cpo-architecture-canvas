name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site bundle
        run: |
          mkdir -p _site/cpo _site/telecom-platform _site/platform-picture _site/roadmap
          cp index.html nav.css .nojekyll _site/
          cp cpo/index.html cpo/app.js cpo/data.js cpo/styles.css cpo/edit.js _site/cpo/
          cp telecom-platform/index.html telecom-platform/app.js telecom-platform/data.js telecom-platform/styles.css telecom-platform/edit.js _site/telecom-platform/
          cp platform-picture/index.html platform-picture/app.js platform-picture/data.js platform-picture/styles.css platform-picture/edit.js _site/platform-picture/
          cp roadmap/index.html roadmap/roadmap.css roadmap/roadmap_slide.png _site/roadmap/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
