<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <title>MegaFon CPO Architecture</title>
  <link rel="stylesheet" href="styles.css">
</head>

  <header class="page-header">

    <section class="panel" id="teams-section"></section>
    <details class="panel collapsible" id="flow-section" open></details>

  <script src="data.js"></script>
  <script>window.EDIT_MODE = new URLSearchParams(location.search).has('edit');</script>
